[project]
name = "odoo-mcp"
version = "0.27.0"
description = "Security-first MCP server for Odoo (XML-RPC, local stdio, multi-instance)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pieter-Jan Luyssen" }]
dependencies = [
    # Capped below 2.0: the SDK's 2.x line rebuilt the low-level server API
    # that `server.build_server` is written against. `Server.list_tools` /
    # `.call_tool` / `.list_prompts` / `.get_prompt` no longer exist there
    # (handlers register via `add_request_handler` instead), so building the
    # server raises AttributeError before it can serve a single request.
    # uv.lock protects `uv sync`, but `uv tool install` (install.sh step 8)
    # resolves from this constraint alone — without the cap it puts a
    # non-starting `odoo-mcp` on the user's PATH. Lift the cap only together
    # with the 2.x handler-API migration.
    "mcp>=1.2.0,<2",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "python-dotenv>=1.0",
    "pre-commit>=3.7",
]

[project.scripts]
odoo-mcp = "odoo_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The odoo_addon/ subtree is Odoo module code — it follows Odoo's own
# conventions (no type annotations, server-side framework methods) and
# is shipped untested. Don't lint it with our strict Python config.
extend-exclude = ["odoo_addon"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "S",                # bandit
    "ANN",              # flake8-annotations
    "RET",              # flake8-return
    "SIM",              # flake8-simplify
]
ignore = [
    "S101",              # asserts are fine in tests
    "ANN401",            # Any is appropriate at the XML-RPC / JSON boundary
    "E501",              # line length is enforced by ruff format, not check
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["odoo_addon/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a live Odoo instance (set ODOO_MCP_TEST_INSTANCE)",
]
