name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # All third-party actions pinned to a full commit SHA. The tag
      # name in the comment is the tag we resolved at pin-time. Bump
      # via dependabot or manually with:
      #   gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/odoo_mcp

      - name: Pytest
        run: uv run pytest -q

      - name: Build package
        run: uv build

      - name: Verify package metadata
        run: |
          uv run python -c "$(cat <<'PY'
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          p = data['project']
          assert p['name'] == 'odoo-mcp', p['name']
          assert p['version'], 'version empty'
          assert p['license']['text'] == 'MIT', p['license']
          assert p['requires-python'].startswith('>=3.11'), p['requires-python']
          deps = {dep.split('>')[0].split('=')[0].strip() for dep in p['dependencies']}
          assert 'mcp' in deps, deps
          assert 'keyring' in deps, deps
          print('pyproject.toml metadata OK')
          PY
          )"

  dependency-audit:
    runs-on: ubuntu-latest
    # First introduction: do not fail CI on a vulnerability until we
    # have a triage SLA. Operators see the report in the Actions log
    # and can react. Promote to hard-fail (remove continue-on-error)
    # once a vuln-response process is in place.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install the runtime closure
        # Resolved from the pyproject constraints, not uv.lock — the same
        # way ``uv tool install`` (install.sh step 8) resolves what users
        # actually get.
        run: pip install -e .

      - name: Audit runtime dependencies
        # Audit exactly the project's resolved closure, nothing else.
        # ``pip freeze`` omits pip / setuptools / wheel and
        # ``--exclude-editable`` drops odoo-mcp itself (not on PyPI);
        # pip-audit runs from pipx's isolated venv so its own
        # dependency tree (requests, urllib3, ...) is not in the set;
        # ``--no-deps --disable-pip`` audits the pinned lines as-is
        # with no second resolution. Before this the job audited the
        # whole ``setup-python`` environment — the runner's own
        # setuptools (PYSEC-2026-3447) and pip-audit's dependencies
        # included — and had been red on every PR for that reason,
        # which is how a real advisory gets ignored.
        #
        # Ignored advisories (revisit each on every CI cleanup pass):
        #
        # PYSEC-2025-183 — pyjwt "weak encryption". Affects every
        # pyjwt release up to 2.12.1 (the latest), no fix version
        # available. **Disputed by the pyjwt maintainers**: the
        # advisory points at applications that pick weak HMAC keys,
        # not at the library itself. odoo-mcp does not call pyjwt
        # directly — it arrives transitively via ``mcp[crypto]`` —
        # and the MCP client/server handshake we use doesn't sign
        # or verify JWTs at all. Tracker for removal: drop this
        # ignore the next time pip-audit reports a fix version, or
        # when ``mcp`` drops the pyjwt dependency.
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/runtime-closure.txt"
          test -s "$RUNNER_TEMP/runtime-closure.txt"
          pipx run pip-audit==2.7.3 \
            --requirement "$RUNNER_TEMP/runtime-closure.txt" \
            --no-deps \
            --disable-pip \
            --progress-spinner off \
            --ignore-vuln PYSEC-2025-183
