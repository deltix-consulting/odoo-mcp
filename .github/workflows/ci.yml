name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # All third-party actions pinned to a full commit SHA. The tag
      # name in the comment is the tag we resolved at pin-time. Bump
      # via dependabot or manually with:
      #   gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/odoo_mcp

      - name: Pytest
        run: uv run pytest -q

      - name: Build package
        run: uv build

      - name: Verify package metadata
        run: |
          uv run python -c "$(cat <<'PY'
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          p = data['project']
          assert p['name'] == 'odoo-mcp', p['name']
          assert p['version'], 'version empty'
          assert p['license']['text'] == 'MIT', p['license']
          assert p['requires-python'].startswith('>=3.11'), p['requires-python']
          deps = {dep.split('>')[0].split('=')[0].strip() for dep in p['dependencies']}
          assert 'mcp' in deps, deps
          assert 'keyring' in deps, deps
          print('pyproject.toml metadata OK')
          PY
          )"

  fresh-resolve:
    runs-on: ubuntu-latest
    # Every other job installs with `uv sync`, which resolves from
    # `uv.lock`. That can only ever prove the *pinned* dependency set
    # works. The user-facing install path is `uv tool install --editable .`
    # (scripts/install.sh step 8, scripts/install.ps1), which resolves
    # from the `pyproject.toml` constraints and ignores the lockfile
    # entirely — so a constraint that admits a broken upstream release is
    # invisible to CI while shipping a non-starting CLI to every new user.
    #
    # That is not hypothetical: mcp 2.0.0 removed the low-level `Server`
    # decorators `build_server` is written against, and the constraint was
    # an unbounded `mcp>=1.2.0`. Neither CI nor `uv sync` could see it.
    #
    # This job resolves from the constraints with no lockfile, so it tests
    # whatever a user installing today would actually get.
    #
    # Soft-fail for now, matching `dependency-audit` below: a brand-new
    # upstream release shouldn't red-light unrelated PRs before anyone has
    # triaged it. Promote to hard-fail (drop `continue-on-error`) once
    # there is a triage SLA.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Resolve dependencies from constraints, ignoring uv.lock
        # `uv pip install` (unlike `uv sync`) does not consult uv.lock.
        run: |
          uv venv -p 3.11
          uv pip install -e ".[dev]"

      - name: Report the resolved set
        run: uv pip list

      - name: Verify the low-level Server API build_server depends on
        # Fails loudly *before* the suite, so the log names the cause
        # rather than a wall of import errors.
        run: |
          uv run --no-sync python -c "$(cat <<'PY'
          import importlib.metadata as md
          from mcp.server import Server

          REQUIRED = ("list_tools", "call_tool", "list_prompts", "get_prompt")
          version = md.version("mcp")
          missing = [n for n in REQUIRED if not hasattr(Server("probe"), n)]
          print(f"resolved mcp == {version}")
          if missing:
              raise SystemExit(
                  f"mcp {version} no longer exposes the low-level Server "
                  "decorators that src/odoo_mcp/server.py::build_server is "
                  f"written against: {missing}.\n"
                  "A fresh `uv tool install` would put a non-starting "
                  "odoo-mcp on the user's PATH.\n"
                  "Fix: cap the `mcp` constraint in pyproject.toml, or "
                  "migrate build_server to the new handler-registration API."
              )
          print("low-level Server decorator surface OK")
          PY
          )"

      - name: Pytest against the freshly resolved set
        run: uv run --no-sync pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    # First introduction: do not fail CI on a vulnerability until we
    # have a triage SLA. Operators see the report in the Actions log
    # and can react. Promote to hard-fail (remove continue-on-error)
    # once a vuln-response process is in place.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install "pip-audit==2.7.3"

      - name: Audit runtime dependencies
        # ``--skip-editable`` drops the editable install of odoo-mcp
        # itself (the project isn't on PyPI). ``--strict`` is left
        # off so the resulting "skipped" warning doesn't fatally
        # red-light the audit — pip-audit still exits non-zero on
        # real vulnerabilities.
        #
        # Ignored advisories (revisit each on every CI cleanup pass):
        #
        # PYSEC-2025-183 — pyjwt "weak encryption". Affects every
        # pyjwt release up to 2.12.1 (the latest), no fix version
        # available. **Disputed by the pyjwt maintainers**: the
        # advisory points at applications that pick weak HMAC keys,
        # not at the library itself. odoo-mcp does not call pyjwt
        # directly — it arrives transitively via ``mcp[crypto]`` —
        # and the MCP client/server handshake we use doesn't sign
        # or verify JWTs at all. Tracker for removal: drop this
        # ignore the next time pip-audit reports a fix version, or
        # when ``mcp`` drops the pyjwt dependency.
        run: |
          pip install -e .
          pip-audit \
            --skip-editable \
            --progress-spinner off \
            --ignore-vuln PYSEC-2025-183
